[platformio]
; Bản mới nhóm phần cứng gửi là .ino (mở được bằng Arduino IDE). Trỏ src_dir
; vào chính thư mục này để PlatformIO cũng biên dịch đúng file đó — một mã
; nguồn duy nhất, hai bộ công cụ, không sợ hai bản lệch nhau.
src_dir = .

[env:genericSTM32F411CE]
platform = ststm32
board = genericSTM32F411CE
framework = arduino
upload_protocol = stlink
debug_tool      = stlink
platform_packages =
    tool-openocd@~2.1100.0
lib_deps =
 marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
 ; Cảm biến không khí DHT22 (main.cpp: #include <DHT.h>). Adafruit Unified
 ; Sensor là phụ thuộc bắt buộc của thư viện DHT, thiếu là không biên dịch được.
 adafruit/DHT sensor library @ ^1.4.6
 adafruit/Adafruit Unified Sensor @ ^1.1.14
monitor_speed = 115200
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON